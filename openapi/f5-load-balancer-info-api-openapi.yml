openapi: 3.2.0
info:
  title: F5 Load Balancer Info API
  contact:
    name: F5 Networks Support
    email: support@f5.com
    url: https://www.f5.com/services/support
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://www.f5.com/company/policies/terms-of-use
  version: '1.0'
  description: 'Operations tagged Info across 2 of this provider''s published API definitions: f5-load-balancer-as3-openapi.yml, f5-load-balancer-declarative-onboarding-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{bigip_host}/mgmt/shared/appsvcs
  description: BIG-IP AS3 Extension Endpoint
  variables:
    bigip_host:
      default: 192.168.1.245
      description: Hostname or IP address of the BIG-IP device
- url: https://{bigip_host}/mgmt/shared/declarative-onboarding
  description: BIG-IP Declarative Onboarding Endpoint
  variables:
    bigip_host:
      default: 192.168.1.245
      description: Hostname or IP address of the BIG-IP device. Use port 8443 for single-NIC BIG-IP deployments.
security:
- basicAuth: []
- tokenAuth: []
tags:
- name: Info
  description: Retrieve version and capability information about the installed AS3 extension.
paths:
  /info:
    get:
      operationId: getInfo
      summary: F5 Load Balancer Get AS3 extension information
      description: Retrieves version, release, and schema version information for the installed AS3 extension on the BIG-IP system.
      tags:
      - Info
      responses:
        '200':
          description: AS3 information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AS3Info'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{bigip_host}/mgmt/shared/appsvcs
      description: BIG-IP AS3 Extension Endpoint
      variables:
        bigip_host:
          default: 192.168.1.245
          description: Hostname or IP address of the BIG-IP device
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    AS3Info:
      type: object
      properties:
        version:
          type: string
          description: AS3 extension version.
        release:
          type: string
          description: AS3 release identifier.
        schemaCurrent:
          type: string
          description: Current AS3 schema version.
        schemaMinimum:
          type: string
          description: Minimum supported AS3 schema version.
    DOInfo:
      type: object
      properties:
        version:
          type: string
          description: Declarative Onboarding extension version.
        release:
          type: string
          description: DO release identifier.
        schemaCurrent:
          type: string
          description: Current DO schema version.
        schemaMinimum:
          type: string
          description: Minimum supported DO schema version.
  responses:
    Unauthorized:
      description: Authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using BIG-IP admin credentials.
    tokenAuth:
      type: apiKey
      in: header
      name: X-F5-Auth-Token
      description: Token-based authentication obtained from the /mgmt/shared/authn/login endpoint.
x-refined-from:
- f5-load-balancer-as3-openapi.yml
- f5-load-balancer-declarative-onboarding-openapi.yml
