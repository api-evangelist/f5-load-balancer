openapi: 3.2.0
info:
  title: F5 Load Balancer F5 BIG-IP iControl REST Policies API
  description: The iControl REST API provides programmatic access to manage and configure F5 BIG-IP devices. It enables automation of Local Traffic Manager (LTM) resources including virtual servers, pools, nodes, pool members, monitors, profiles, and policies for application delivery, load balancing, and network management. iControl REST is a RESTful interface that allows any configuration or management task achievable through the BIG-IP command line to be performed programmatically.
  version: 15.1.0
  contact:
    name: F5 Networks Support
    email: support@f5.com
    url: https://www.f5.com/services/support
  license:
    name: Proprietary
    url: https://www.f5.com/company/policies/terms-of-use
  termsOfService: https://www.f5.com/company/policies/terms-of-use
servers:
- url: https://{bigip_host}/mgmt/tm
  description: BIG-IP Management Interface
  variables:
    bigip_host:
      default: 192.168.1.245
      description: Hostname or IP address of the BIG-IP device
security:
- basicAuth: []
- tokenAuth: []
tags:
- name: Policies
  description: Manage local traffic policies that provide rule-based traffic steering and content manipulation capabilities.
paths:
  /ltm/policy:
    get:
      operationId: listPolicies
      summary: F5 Load Balancer List local traffic policies
      description: Retrieves all local traffic policies on the BIG-IP system. Policies provide rule-based traffic steering, content manipulation, and request/response modification.
      tags:
      - Policies
      responses:
        '200':
          description: Successfully retrieved policy collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
        message:
          type: string
          description: Human-readable error message.
        errorStack:
          type: array
          items:
            type: string
          description: Stack trace for debugging purposes.
    PolicyCollection:
      type: object
      properties:
        kind:
          type: string
        selfLink:
          type: string
          format: uri
        items:
          type: array
          items:
            type: object
  responses:
    Unauthorized:
      description: Authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using BIG-IP admin credentials.
    tokenAuth:
      type: apiKey
      in: header
      name: X-F5-Auth-Token
      description: Token-based authentication obtained from the /mgmt/shared/authn/login endpoint. Tokens expire after a configurable timeout period.
externalDocs:
  description: F5 iControl REST API Documentation
  url: https://clouddocs.f5.com/api/icontrol-rest/
