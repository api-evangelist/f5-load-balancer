naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP iControl REST API — SSL Certificates
  description: 'F5 Load Balancer F5 BIG-IP iControl REST API — SSL Certificates. 1 operations. Lead operation: F5 Load Balancer
    List SSL certificates. Self-contained Naftiko capability covering one F5 Load Balancer business surface.'
  tags:
  - F5 Load Balancer
  - SSL Certificates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: icontrol-rest-ssl-certificates
    baseUri: https://{bigip_host}/mgmt/tm
    description: F5 Load Balancer F5 BIG-IP iControl REST API — SSL Certificates business capability. Self-contained, no shared
      references.
    resources:
    - name: sys-file-ssl-cert
      path: /sys/file/ssl-cert
      operations:
      - name: listsslcertificates
        method: GET
        description: F5 Load Balancer List SSL certificates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: icontrol-rest-ssl-certificates-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP iControl REST API — SSL Certificates. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sys/file/ssl-cert
      name: sys-file-ssl-cert
      description: REST surface for sys-file-ssl-cert.
      operations:
      - method: GET
        name: listsslcertificates
        description: F5 Load Balancer List SSL certificates
        call: icontrol-rest-ssl-certificates.listsslcertificates
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: icontrol-rest-ssl-certificates-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP iControl REST API — SSL Certificates. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-ssl
      description: F5 Load Balancer List SSL certificates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: icontrol-rest-ssl-certificates.listsslcertificates
      outputParameters:
      - type: object
        mapping: $.
