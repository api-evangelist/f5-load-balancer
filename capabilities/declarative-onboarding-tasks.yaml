naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Tasks
  description: 'F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Tasks. 2 operations. Lead operation: F5 Load
    Balancer List all DO tasks. Self-contained Naftiko capability covering one F5 Load Balancer business surface.'
  tags:
  - F5 Load Balancer
  - Tasks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: declarative-onboarding-tasks
    baseUri: https://{bigip_host}/mgmt/shared/declarative-onboarding
    description: F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Tasks business capability. Self-contained, no
      shared references.
    resources:
    - name: task
      path: /task
      operations:
      - name: listonboardingtasks
        method: GET
        description: F5 Load Balancer List all DO tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: task-taskId
      path: /task/{taskId}
      operations:
      - name: getonboardingtask
        method: GET
        description: F5 Load Balancer Get a specific DO task status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: declarative-onboarding-tasks-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Tasks. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/task
      name: task
      description: REST surface for task.
      operations:
      - method: GET
        name: listonboardingtasks
        description: F5 Load Balancer List all DO tasks
        call: declarative-onboarding-tasks.listonboardingtasks
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/task/{taskid}
      name: task-taskid
      description: REST surface for task-taskId.
      operations:
      - method: GET
        name: getonboardingtask
        description: F5 Load Balancer Get a specific DO task status
        call: declarative-onboarding-tasks.getonboardingtask
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: declarative-onboarding-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Tasks. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-all
      description: F5 Load Balancer List all DO tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: declarative-onboarding-tasks.listonboardingtasks
      outputParameters:
      - type: object
        mapping: $.
    - name: f5-load-balancer-get-specific
      description: F5 Load Balancer Get a specific DO task status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: declarative-onboarding-tasks.getonboardingtask
      outputParameters:
      - type: object
        mapping: $.
