naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Config
  description: 'F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Config. 2 operations. Lead operation: F5 Load
    Balancer List original device configurations. Self-contained Naftiko capability covering one F5 Load Balancer business
    surface.'
  tags:
  - F5 Load Balancer
  - Config
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: declarative-onboarding-config
    baseUri: https://{bigip_host}/mgmt/shared/declarative-onboarding
    description: F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Config business capability. Self-contained,
      no shared references.
    resources:
    - name: config
      path: /config
      operations:
      - name: listoriginalconfigs
        method: GET
        description: F5 Load Balancer List original device configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: config-machineId
      path: /config/{machineId}
      operations:
      - name: getoriginalconfig
        method: GET
        description: F5 Load Balancer Get original configuration for a device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: declarative-onboarding-config-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Config. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/config
      name: config
      description: REST surface for config.
      operations:
      - method: GET
        name: listoriginalconfigs
        description: F5 Load Balancer List original device configurations
        call: declarative-onboarding-config.listoriginalconfigs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/config/{machineid}
      name: config-machineid
      description: REST surface for config-machineId.
      operations:
      - method: GET
        name: getoriginalconfig
        description: F5 Load Balancer Get original configuration for a device
        call: declarative-onboarding-config.getoriginalconfig
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: declarative-onboarding-config-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP Declarative Onboarding (DO) API — Config. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-original
      description: F5 Load Balancer List original device configurations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: declarative-onboarding-config.listoriginalconfigs
      outputParameters:
      - type: object
        mapping: $.
    - name: f5-load-balancer-get-original
      description: F5 Load Balancer Get original configuration for a device
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: declarative-onboarding-config.getoriginalconfig
      outputParameters:
      - type: object
        mapping: $.
