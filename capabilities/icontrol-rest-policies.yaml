naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP iControl REST API — Policies
  description: 'F5 Load Balancer F5 BIG-IP iControl REST API — Policies. 1 operations. Lead operation: F5 Load Balancer List
    local traffic policies. Self-contained Naftiko capability covering one F5 Load Balancer business surface.'
  tags:
  - F5 Load Balancer
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: icontrol-rest-policies
    baseUri: https://{bigip_host}/mgmt/tm
    description: F5 Load Balancer F5 BIG-IP iControl REST API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: ltm-policy
      path: /ltm/policy
      operations:
      - name: listpolicies
        method: GET
        description: F5 Load Balancer List local traffic policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: icontrol-rest-policies-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP iControl REST API — Policies. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ltm/policy
      name: ltm-policy
      description: REST surface for ltm-policy.
      operations:
      - method: GET
        name: listpolicies
        description: F5 Load Balancer List local traffic policies
        call: icontrol-rest-policies.listpolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: icontrol-rest-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP iControl REST API — Policies. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-local
      description: F5 Load Balancer List local traffic policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: icontrol-rest-policies.listpolicies
      outputParameters:
      - type: object
        mapping: $.
