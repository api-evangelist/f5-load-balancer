naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP iControl REST API — Data Groups
  description: 'F5 Load Balancer F5 BIG-IP iControl REST API — Data Groups. 1 operations. Lead operation: F5 Load Balancer
    List internal data groups. Self-contained Naftiko capability covering one F5 Load Balancer business surface.'
  tags:
  - F5 Load Balancer
  - Data Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: icontrol-rest-data-groups
    baseUri: https://{bigip_host}/mgmt/tm
    description: F5 Load Balancer F5 BIG-IP iControl REST API — Data Groups business capability. Self-contained, no shared
      references.
    resources:
    - name: ltm-data-group-internal
      path: /ltm/data-group/internal
      operations:
      - name: listinternaldatagroups
        method: GET
        description: F5 Load Balancer List internal data groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: icontrol-rest-data-groups-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP iControl REST API — Data Groups. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ltm/data-group/internal
      name: ltm-data-group-internal
      description: REST surface for ltm-data-group-internal.
      operations:
      - method: GET
        name: listinternaldatagroups
        description: F5 Load Balancer List internal data groups
        call: icontrol-rest-data-groups.listinternaldatagroups
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: icontrol-rest-data-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP iControl REST API — Data Groups. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-internal
      description: F5 Load Balancer List internal data groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: icontrol-rest-data-groups.listinternaldatagroups
      outputParameters:
      - type: object
        mapping: $.
