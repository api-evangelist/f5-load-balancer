naftiko: 1.0.0-alpha2
info:
  label: F5 Load Balancer F5 BIG-IP Application Services 3 Extension (AS3) API — Tasks
  description: 'F5 Load Balancer F5 BIG-IP Application Services 3 Extension (AS3) API — Tasks. 2 operations. Lead operation:
    F5 Load Balancer List all AS3 tasks. Self-contained Naftiko capability covering one F5 Load Balancer business surface.'
  tags:
  - F5 Load Balancer
  - Tasks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    F5_LOAD_BALANCER_API_KEY: F5_LOAD_BALANCER_API_KEY
capability:
  consumes:
  - type: http
    namespace: as3-tasks
    baseUri: https://{bigip_host}/mgmt/shared/appsvcs
    description: F5 Load Balancer F5 BIG-IP Application Services 3 Extension (AS3) API — Tasks business capability. Self-contained,
      no shared references.
    resources:
    - name: task
      path: /task
      operations:
      - name: listtasks
        method: GET
        description: F5 Load Balancer List all AS3 tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: task-taskId
      path: /task/{taskId}
      operations:
      - name: gettask
        method: GET
        description: F5 Load Balancer Get status of a specific task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-F5-Auth-Token
      value: '{{env.F5_LOAD_BALANCER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: as3-tasks-rest
    port: 8080
    description: REST adapter for F5 Load Balancer F5 BIG-IP Application Services 3 Extension (AS3) API — Tasks. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/task
      name: task
      description: REST surface for task.
      operations:
      - method: GET
        name: listtasks
        description: F5 Load Balancer List all AS3 tasks
        call: as3-tasks.listtasks
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/task/{taskid}
      name: task-taskid
      description: REST surface for task-taskId.
      operations:
      - method: GET
        name: gettask
        description: F5 Load Balancer Get status of a specific task
        call: as3-tasks.gettask
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: as3-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for F5 Load Balancer F5 BIG-IP Application Services 3 Extension (AS3) API — Tasks. One tool per
      consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: f5-load-balancer-list-all
      description: F5 Load Balancer List all AS3 tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: as3-tasks.listtasks
      outputParameters:
      - type: object
        mapping: $.
    - name: f5-load-balancer-get-status
      description: F5 Load Balancer Get status of a specific task
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: as3-tasks.gettask
      outputParameters:
      - type: object
        mapping: $.
